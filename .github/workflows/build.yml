name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  changelog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      release_notes: ${{ steps.persist_notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      # cliff 的 notes 持久化为多行 output：build 阶段传给 tauri-action 的 releaseBody。
      # 不传时 tauri-action 会用 head_commit.message 覆盖 release body（v0.1.6 实测），
      # 导致 changelog 只剩一条提交信息
      - name: Persist release notes
        id: persist_notes
        env:
          NOTES: ${{ steps.git-cliff.outputs.content }}
        run: |
          {
            echo 'notes<<NOTES_EOF'
            printf '%s' "$NOTES"
            echo
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # 先建 draft release，各平台构建用 releaseId 直传产物，避免多 job 并发创建同一 release 撞 already_exists
      # release_id 必须直接取自创建响应（列表接口存在读后延迟，2026-09-19 v0.1.1 run 曾因此回读 null，
      # tauri-action 拿到空 releaseId 退回按 tag 查找→draft 查不到→"releaseName not set" 报错）
      - name: Create draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.git-cliff.outputs.content }}
        run: |
          printf '%s' "$NOTES" > /tmp/release-notes.md
          jq -n --arg tag "${{ github.ref_name }}" \
                --arg name "SCX Terminal ${{ github.ref_name }}" \
                --rawfile notes /tmp/release-notes.md \
                '{tag_name: $tag, name: $name, body: $notes, draft: true}' > /tmp/release-payload.json
          release_id=$(gh api --method POST "repos/${{ github.repository }}/releases" \
            --input /tmp/release-payload.json \
            --jq '.id') || release_id=''
          # re-run 场景：同名 release 已存在（already_exists）→ 回退列表按 tag_name 匹配
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            release_id=$(gh api "repos/${{ github.repository }}/releases" \
              --jq "[.[] | select(.tag_name == \"${{ github.ref_name }}\")][0].id")
          fi
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::release_id not resolvable for tag ${{ github.ref_name }}"
            exit 1
          fi
          # 已存在的 release（手动建/re-run 复用）不会经过上面的 create 赋值，
          # 统一补 PATCH 一次 notes，保证 body 与 cliff 输出一致
          jq -n --rawfile notes /tmp/release-notes.md '{body: $notes}' > /tmp/notes-payload.json
          gh api --method PATCH "repos/${{ github.repository }}/releases/$release_id" \
            --input /tmp/notes-payload.json >/dev/null
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Run frontend tests
        run: bun run test

      # secrets 模块测试依赖 macOS 钥匙串，CI 非交互环境会挂起，跳过
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -- --skip secrets

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign 签名密钥就位后 tauri-action 自动产出 updater 产物（.app.tar.gz/.nsis.zip + .sig）
          # 并生成/合并多平台 latest.json 上传到 release；draft 转正式发布前客户端不可见（endpoint 404）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.changelog.outputs.release_id }}
          releaseBody: ${{ needs.changelog.outputs.release_notes }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  # 全平台产物就绪后才把 draft 转正式发布；部分失败时 draft 保留，re-run all jobs 即可重新走完整流程
  publish:
    needs: [changelog, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH 'repos/${{ github.repository }}/releases/${{ needs.changelog.outputs.release_id }}' -F draft=false

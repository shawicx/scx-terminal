name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  changelog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      # 先建 draft release，各平台构建用 releaseId 直传产物，避免多 job 并发创建同一 release 撞 already_exists
      - name: Create draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.git-cliff.outputs.content }}
        run: |
          printf '%s' "$NOTES" > /tmp/release-notes.md
          gh release create '${{ github.ref_name }}' --draft \
            --title 'SCX Terminal ${{ github.ref_name }}' \
            --notes-file /tmp/release-notes.md
          # draft release 在发布前不关联真实 tag，GET /releases/tags/{tag} 返回 404，需从 release 列表按 tag_name 匹配
          release_id=$(gh api 'repos/${{ github.repository }}/releases' \
            --jq "[.[] | select(.tag_name == '${{ github.ref_name }}')][0].id")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Run frontend tests
        run: bun run test

      # secrets 模块测试依赖 macOS 钥匙串，CI 非交互环境会挂起，跳过
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -- --skip secrets

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.changelog.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  # 全平台产物就绪后才把 draft 转正式发布；部分失败时 draft 保留，re-run all jobs 即可重新走完整流程
  publish:
    needs: [changelog, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH 'repos/${{ github.repository }}/releases/${{ needs.changelog.outputs.release_id }}' -F draft=false

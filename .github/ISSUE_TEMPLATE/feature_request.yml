name: 功能请求
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 感谢提议！请先搜索现有 Issue，避免重复提交。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望的功能形态；如有参考（其他终端的同类功能）请一并说明
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 你目前是如何变通解决的
  - type: textarea
    id: extra
    attributes:
      label: 补充信息

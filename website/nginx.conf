# ============================================================
# @description scx-terminal 官网 nginx 配置（纯静态托管，无 API 反代）
# 与 scx-gold（6900）同 ECS --network host 部署，监听 6901
# ============================================================

server {
    listen 6901;
    server_name _;

    # 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态双页站点：链接均为显式 index.html，404 直接返回，不做 SPA fallback
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 入口禁长缓存（配合 etag），保证部署后更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 字体与图标可较长缓存（基本不变更）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
